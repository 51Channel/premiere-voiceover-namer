<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>面板总览</title>
<style>
  body { margin: 0; padding: 20px; background: #141414; color: #888; font: 12px -apple-system, "PingFang SC", sans-serif; display: flex; gap: 20px; }
  figure { margin: 0; }
  iframe { width: 340px; height: 600px; border: 0; border-radius: 10px; display: block; }
  figcaption { margin-top: 8px; text-align: center; }
</style></head>
<body>
  <figure><iframe src="/?state=ready"></iframe><figcaption>平时：等你录</figcaption></figure>
  <figure><iframe src="/?state=done"></iframe><figcaption>录完：自动改好</figcaption></figure>
  <figure><iframe src="/?state=old"></iframe><figcaption>老录音：一键编号</figcaption></figure>
  <figure><iframe src="/?state=dup"></iframe><figcaption>撞名素材：确认后改开</figcaption></figure>
</body></html>
